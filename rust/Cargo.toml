[package]
name = "snapclip"
version = "1.0.0"
edition = "2021"
description = "SnapClip backend — video downloader & trimmer (yt-dlp + ffmpeg)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
